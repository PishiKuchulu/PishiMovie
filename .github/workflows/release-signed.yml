name: Signed release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pishimovie-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore signing key from repo secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ runner.temp }}/release.keystore"
          cat > key.properties <<EOF
          storeFile=${{ runner.temp }}/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          ls -l "${{ runner.temp }}/release.keystore"

      - name: Build signed release APK
        run: ./gradlew --no-daemon clean :app:assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-universal-release.apk

      - name: Rename APKs with version + checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd app/build/outputs/apk/release
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            src="app-${abi}-release.apk"
            [ -f "$src" ] || continue
            if [ "$abi" = "universal" ]; then name="PishiMovie-${VERSION}"; else name="PishiMovie-${VERSION}-${abi}"; fi
            mv "$src" "${name}.apk"
            sha256sum "${name}.apk" > "${name}.apk.sha256"
          done
          ls -l

      - name: Publish signed release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/PishiMovie-*.apk
            app/build/outputs/apk/release/PishiMovie-*.apk.sha256
          name: PishiMovie ${{ github.ref_name }} (signed)
