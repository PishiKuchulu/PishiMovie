name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Resolve version
        # Single source of truth: versionName in app/build.gradle.kts.
        id: ver
        run: echo "version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        # The project builds per-ABI APK splits; the universal APK runs on all devices.
        run: mv app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/pishimovie-${{ steps.ver.outputs.version }}-debug.apk

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pishimovie-debug-apk
          path: app/build/outputs/apk/debug/pishimovie-${{ steps.ver.outputs.version }}-debug.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PishiMovie build ${{ github.run_number }} (نسخه ${{ steps.ver.outputs.version }})
          draft: false
          prerelease: true
          files: app/build/outputs/apk/debug/pishimovie-${{ steps.ver.outputs.version }}-debug.apk
          body: |
            این بیلد آزمایشی است و برای تست انتشار شده است.
