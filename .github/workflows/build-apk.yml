name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        # The project builds per-ABI APK splits; the universal APK runs on all devices.
        run: mv app/build/outputs/apk/debug/app-universal-debug.apk app/build/outputs/apk/debug/pishimovie-1.2.2-debug.apk

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PishiMovie-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest build — آخرین بیلد"
          body: |
            آخرین بیلد خودکار از برنچ `main` (نسخه 1.2.2).
            Latest automatic debug build from the `main` branch.
          files: app/build/outputs/apk/debug/pishimovie-1.2.2-debug.apk
